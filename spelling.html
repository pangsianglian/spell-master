<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spelling - SpellMaster Kids</title>
  <link rel="manifest" href="manifest.json?v=20260508-v233" />
  <link rel="stylesheet" href="css/style.css?v=20260508-v233" />
</head>
<body>
  <main class="app-shell">
    <div class="hero-mascot small" aria-hidden="true">🐊</div>
    <h1>Listen & Spell</h1>
    <div id="app-version" class="version"></div>
    <div class="top-row"><span id="list-title"></span><span id="progress"></span></div>
    <div class="badge" id="mode-badge"></div>

    <div id="spelling-screen">
      <div class="mode-toggle" aria-label="Spelling mode">
        <label><input type="radio" name="spellingPlayMode" value="audio" checked /> 🎧 Audio</label>
        <label><input type="radio" name="spellingPlayMode" value="quiet" /> 👀 Quiet</label>
        <label><input type="radio" name="spellingPlayMode" value="both" /> 🔁 Both</label>
      </div>

      <div class="sentence-hint">🎯 Type the spelling. Use sound, quiet clues, or both.</div>
      <input type="text" id="spelling-input" placeholder="Type spelling here..." autocomplete="off" />

      <div class="button-row two-col">
        <button onclick="checkSpellingAnswer()">✅ Check</button>
        <button onclick="pronounceWord()" class="dark">🔊 Hear Word</button>
        <button onclick="showSpellingHint()" class="warning">💡 Hint</button>
        <button onclick="skipSpellingWord()" class="secondary">➡️ Skip</button>
        <button onclick="showSpellingAnswer()" class="helper-action">👀 Show Answer</button>
      </div>

      <div class="helper-panel" id="helper-panel">
        <div class="helper-card">
          <h3>💡 Sentence Clue</h3>
          <p id="sentence-helper">Use the sentence to understand the word.</p>
        </div>
        <div class="helper-card">
          <h3>🔤 Helper Letters</h3>
          <p id="letter-helper">Letters will appear here.</p>
        </div>
        <div class="helper-card">
          <h3>🐊 Crocodile Clue</h3>
          <p id="croc-helper">Starts with ...</p>
        </div>
      </div>

      <div id="feedback" class="feedback"></div>
      <button onclick="window.location.href='index.html'" class="secondary">⬅️ Back to Menu</button>
    </div>

    <div id="result-screen" class="hidden"></div>
  </main>

  <script src="js/app-config.js?v=20260508-v233"></script>
  <script src="js/analytics.js?v=20260508-v233"></script>
  <script src="js/default-data.js?v=20260508-v233"></script>
  <script src="js/storage.js?v=20260508-v233"></script>
  <script src="js/speech.js?v=20260508-v233"></script>
  <script src="js/session-utils.js?v=20260508-v233"></script>
  <script src="js/spelling.js?v=20260508-v233"></script>
</body>
</html>
