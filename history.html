<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stars & History - SpellMaster Kids</title>
  <link rel="manifest" href="manifest.json?v=20260508-v225" />
  <link rel="stylesheet" href="css/style.css?v=20260508-v225" />
</head>
<body>
  <main class="app-shell">
    <div class="hero-mascot small" aria-hidden="true">⭐</div>
    <h1>My Stars & History</h1>
    <div id="app-version" class="version"></div>
    <div id="history-box"></div>
    <button onclick="clearHistory()" class="danger">Clear History</button>
    <a class="button-link secondary" href="index.html">⬅️ Back to Menu</a>
  </main>
  <script src="js/app-config.js?v=20260508-v225"></script>
  <script src="js/default-data.js?v=20260508-v225"></script>
  <script src="js/storage.js?v=20260508-v225"></script>
  <script src="js/session-utils.js?v=20260508-v225"></script>
  <script>
    window.addEventListener('load', () => { renderVersion(); renderHistory(); });
    function renderHistory() {
      const history = getHistory();
      const box = document.getElementById('history-box');
      if (!history.length) { box.innerHTML = '<div class="card">No practice history yet.</div>'; return; }
      box.innerHTML = history.map(record => {
        const weak = record.weakWords.length ? record.weakWords.join(', ') : 'None';
        const skipped = record.skippedWords && record.skippedWords.length ? record.skippedWords.join(', ') : 'None';
        const stars = record.stars || 0;
        return `<section class="card"><h3>${record.listName}</h3><p><strong>${record.random ? 'Random ' : ''}${record.mode}</strong><br>Stars earned: ${stars} ⭐<br>First-try score: ${record.correctFirstTry}/${record.total}<br>Weak words: ${weak}<br>Skipped words: ${skipped}<br>Time: ${formatDuration(record.durationMs)}<br>${new Date(record.endedAt).toLocaleString()}</p></section>`;
      }).join('');
    }
    function clearHistory() {
      if (!confirm('Clear all history?')) return;
      saveHistory([]);
      renderHistory();
    }
  </script>
</body>
</html>
