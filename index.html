<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpellMaster 2026</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #4a90e2; --success: #2ecc71; --error: #e74c3c; --bg: #f4f7f6; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); display: flex; justify-content: center; margin: 0; padding: 20px; color: #333; }
        #app { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); width: 100%; max-width: 450px; }
        h1 { text-align: center; color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #777; font-size: 14px; margin-bottom: 20px; }
        button { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        select, input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; font-size: 16px; }
        input[type="text"] { text-align: center; font-size: 20px; font-weight: bold; }
        .hidden { display: none !important; }
        #feedback { font-weight: bold; text-align: center; margin: 15px 0; min-height: 24px; font-size: 18px; }
        .sentence-hint { font-style: italic; color: #555; text-align: center; margin: 15px 0; font-size: 16px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; background: #eee; border-radius: 8px; cursor: pointer; font-weight: bold; color: #666; }
        .tab.active { background: var(--primary); color: white; }
        .custom-add { background: #f9f9f9; padding: 15px; border-radius: 10px; border: 2px dashed #ccc; }
    </style>
</head>
<body>

<div id="app">
    <h1>SpellMaster</h1>
    <div class="subtitle">Offline Learning Assistant</div>
    
    <!-- Setup Screen -->
    <div id="setup-screen">
        <div class="tab-group">
            <div class="tab active" onclick="switchTab('practice')">Practice Mode</div>
            <div class="tab" onclick="switchTab('add')">Add New List</div>
        </div>

        <!-- Practice Tab -->
        <div id="practice-tab">
            <label><strong>Select a Spelling List:</strong></label>
            <select id="week-selector"></select>
            <button onclick="startPractice()">🚀 Start Spelling</button>
        </div>

        <!-- Add Custom List Tab -->
        <div id="add-tab" class="hidden custom-add">
            <label><strong>List Name:</strong> (e.g., Week 9)</label>
            <input type="text" id="custom-name" placeholder="Enter list name...">
            <label><strong>Words:</strong> (Comma separated)</label>
            <textarea id="custom-words" rows="3" placeholder="apple, banana, orange..."></textarea>
            <button onclick="saveCustomList()" style="background: var(--success);">💾 Save to Device</button>
        </div>
    </div>

    <!-- Practice / Game Screen -->
    <div id="practice-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; font-weight: bold; color: #888;">
            <span id="list-title">Term 2</span>
            <span id="progress">1 / 8</span>
        </div>
        
        <div id="hint-box" class="sentence-hint"></div>
        <button onclick="pronounceCurrent()" style="background: #34495e;">🔊 Hear Word Again</button>
        
        <input type="text" id="user-input" placeholder="Type here..." autocomplete="off">
        <button onclick="checkAnswer()">Check Spelling</button>
        <div id="feedback"></div>
        <button onclick="exitPractice()" style="background:#bdc3c7; color: #333;">🚪 Exit Practice</button>
    </div>
</div>

<script>
// --- 1. Database & Initialization ---

// Default School Lists (from PG_20260430_092156.pdf)[cite: 1]
const defaultData = {
    "Term 2: Week 2": [
        {w: "fly", s: "The bird can fly in the sky."},
        {w: "snap", s: "The crocodile can snap its mouth shut."},
        {w: "tea", s: "My mother made a cup of tea."},
        {w: "open", s: "Please open the door for me."},
        {w: "crawl", s: "The baby can crawl on the floor."},
        {w: "sticks", s: "I picked up some sticks from the ground."},
        {w: "fierce", s: "The lion is big and fierce."},
        {w: "sneeze", s: "I sneeze when I smell pepper."}
    ],
    "Term 2: Week 3": [
        {w: "come", s: "My friends come to my house to play."},
        {w: "door", s: "Please close the door."},
        {w: "hive", s: "Bees live in a hive."},
        {w: "late", s: "Do not be late for school."},
        {w: "huge", s: "The elephant is huge."},
        {w: "sweet", s: "The cake is sweet."},
        {w: "again", s: "I want to read the book again."},
        {w: "crocodile", s: "The crocodile swims in the river."}
    ],
    "Term 2: Week 4": [
        {w: "ran", s: "I ran to catch the bus."},
        {w: "yell", s: "My teacher told us not to yell in class."},
        {w: "many", s: "There are many flowers in the garden."},
        {w: "some", s: "I have some toys in my room."},
        {w: "tasty", s: "The ice-cream is tasty and cold."},
        {w: "grumble", s: "He likes to grumble about the cold weather."},
        {w: "whisper", s: "We must whisper in the library."},
        {w: "roared", s: "The lion roared loudly in the jungle."}
    ]
};

let allLists = {};
let currentList = [];
let currentIndex = 0;

// Load App
window.onload = () => {
    registerServiceWorker();
    loadAllLists();
};

function registerServiceWorker() {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('PWA Offline capabilities active.'));
    }
}

function loadAllLists() {
    allLists = { ...defaultData };
    
    // Check local storage for custom lists added by the user
    const savedCustom = localStorage.getItem('spellmaster-custom');
    if (savedCustom) {
        const customParsed = JSON.parse(savedCustom);
        allLists = { ...allLists, ...customParsed };
    }
    
    refreshDropdown();
}

function refreshDropdown() {
    const selector = document.getElementById('week-selector');
    selector.innerHTML = '';
    Object.keys(allLists).forEach(week => {
        let opt = document.createElement('option');
        opt.value = week;
        opt.innerHTML = week;
        selector.appendChild(opt);
    });
}

// --- 2. Reusability: Adding Custom Lists ---
function saveCustomList() {
    const name = document.getElementById('custom-name').value.trim();
    const wordsRaw = document.getElementById('custom-words').value;
    
    if(!name || !wordsRaw) return alert("Please enter a name and some words.");
    
    // Convert comma list to game format. Provide generic sentence for TTS.
    const wordsArray = wordsRaw.split(',').map(w => w.trim()).filter(w => w !== "");
    const formattedList = wordsArray.map(w => ({ w: w, s: `The word is ${w}.` }));
    
    // Save to memory
    let existingCustom = JSON.parse(localStorage.getItem('spellmaster-custom') || '{}');
    existingCustom[name] = formattedList;
    localStorage.setItem('spellmaster-custom', JSON.stringify(existingCustom));
    
    alert("List saved securely to your device!");
    document.getElementById('custom-name').value = '';
    document.getElementById('custom-words').value = '';
    loadAllLists();
    switchTab('practice');
}

// --- 3. UI Navigation ---
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('practice-tab').classList.add('hidden');
    document.getElementById('add-tab').classList.add('hidden');
    
    if(tab === 'practice') {
        document.getElementById('practice-tab').classList.remove('hidden');
        document.querySelectorAll('.tab')[0].classList.add('active');
    } else {
        document.getElementById('add-tab').classList.remove('hidden');
        document.querySelectorAll('.tab')[1].classList.add('active');
    }
}

// --- 4. Game Logic & TTS ---
function startPractice() {
    const selectedWeek = document.getElementById('week-selector').value;
    currentList = allLists[selectedWeek];
    currentIndex = 0;
    
    document.getElementById('list-title').innerText = selectedWeek;
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('practice-screen').classList.remove('hidden');
    
    loadWord();
}

function loadWord() {
    document.getElementById('user-input').value = "";
    document.getElementById('feedback').innerText = "";
    document.getElementById('progress').innerText = `${currentIndex + 1} / ${currentList.length}`;
    
    const currentObj = currentList[currentIndex];
    
    // Create fill-in-the-blank hint by replacing the word (case insensitive)
    const regex = new RegExp(`\\b${currentObj.w}\\b`, 'gi');
    const hint = currentObj.s.replace(regex, "________");
    document.getElementById('hint-box').innerText = hint;
    
    setTimeout(pronounceCurrent, 500); // Auto-play when word loads
}

function pronounceCurrent() {
    const wordObj = currentList[currentIndex];
    // Speak sentence first, then the word
    const sentenceMsg = new SpeechSynthesisUtterance(wordObj.s);
    const wordMsg = new SpeechSynthesisUtterance(`Spell: ${wordObj.w}`);
    
    sentenceMsg.rate = 0.9; 
    wordMsg.rate = 0.8; 
    
    window.speechSynthesis.speak(sentenceMsg);
    sentenceMsg.onend = () => window.speechSynthesis.speak(wordMsg);
}

function checkAnswer() {
    const userVal = document.getElementById('user-input').value.toLowerCase().trim();
    const correctVal = currentList[currentIndex].w.toLowerCase().trim();
    const feedback = document.getElementById('feedback');

    if (userVal === correctVal) {
        feedback.innerText = "Correct! ✨";
        feedback.style.color = "var(--success)";
        setTimeout(() => {
            currentIndex++;
            if (currentIndex < currentList.length) {
                loadWord();
            } else {
                alert("🎉 Amazing! You finished the list!");
                exitPractice();
            }
        }, 1200);
    } else {
        feedback.innerText = "Try again!";
        feedback.style.color = "var(--error)";
    }
}

function exitPractice() {
    document.getElementById('setup-screen').classList.remove('hidden');
    document.getElementById('practice-screen').classList.add('hidden');
    window.speechSynthesis.cancel(); // Stop audio if exiting early
}

// Allow pressing "Enter" to submit
document.getElementById("user-input").addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    checkAnswer();
  }
});
</script>
</body>
</html>
