<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SpellMaster 2026</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell">
    <h1>SpellMaster</h1>
    <div class="subtitle">Offline spelling revision assistant</div>
    <div id="app-version" class="version"></div>

    <label for="week-selector">Select spelling list</label>
    <select id="week-selector"></select>

    <section class="card">
      <h3>Practice</h3>
      <p>Fill in the blank. Submit your answer. Correct letters stay and wrong letters disappear.</p>
      <button onclick="goToMode('practice', false)">✏️ Practice</button>
      <button onclick="goToMode('practice', true)" class="dark">🔀 Random Practice</button>
    </section>

    <section class="card">
      <h3>Spelling</h3>
      <p>Listen to the word slowly and type the full spelling.</p>
      <button onclick="goToMode('spelling', false)">🔊 Spelling</button>
      <button onclick="goToMode('spelling', true)" class="dark">🔀 Random Spelling</button>
    </section>

    <section class="nav-grid">
      <a class="button-link success" href="lists.html">➕ Add / Manage Lists</a>
      <a class="button-link secondary" href="history.html">📊 View History</a>
    </section>
  </main>

  <script src="js/app-config.js"></script>
  <script src="js/default-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/session-utils.js"></script>
  <script>
    window.addEventListener('load', () => {
      renderVersion();
      loadDropdown();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    });

    function loadDropdown() {
      const selector = document.getElementById('week-selector');
      const allLists = getAllLists();
      const lastList = getLastList();
      selector.innerHTML = '';
      Object.keys(allLists).forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        if (name === lastList) option.selected = true;
        selector.appendChild(option);
      });
    }

    function goToMode(mode, random) {
      const listName = document.getElementById('week-selector').value;
      saveLastList(listName);
      const target = mode === 'practice' ? 'practice.html' : 'spelling.html';
      window.location.href = `${target}?list=${encodeURIComponent(listName)}&random=${random ? '1' : '0'}`;
    }
  </script>
</body>
</html>
